supported_languages:
  - en
  - ru
global_regex_flags: 26

recognizers:
  - name: EmailRecognizer
    type: predefined

  - name: PhoneRecognizer
    type: predefined

  - name: CreditCardRecognizer
    supported_languages:
      - language: en
        context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
      - language: ru
        context: [карта, банковская, банковской, visa, mastercard, мир, номер карты]
    type: predefined

  - name: IbanRecognizer
    type: predefined

  - name: IpRecognizer
    type: predefined

  - name: UrlRecognizer
    type: predefined

  - name: "RU Phone Recognizer"
    type: custom
    supported_language: ru
    supported_entity: RU_PHONE_NUMBER
    context:
      - телефон
      - тел
      - мобильный
      - номер
    patterns:
      - name: "Russian phone number"
        regex: "(?<!\\d)(?:\\+7|8)[\\s\\-\\(]*\\d{3}[\\s\\-\\)]*\\d{3}[\\s\\-]*\\d{2}[\\s\\-]*\\d{2}(?!\\d)"
        score: 0.75

  - name: "RU Passport Recognizer"
    type: custom
    supported_language: ru
    supported_entity: RU_PASSPORT
    context:
      - паспорт
      - серия
      - номер
      - выдан
    patterns:
      - name: "Russian internal passport"
        regex: "(?<!\\d)(?:\\d{2}\\s\\d{2}\\s\\d{6}|\\d{4}\\s\\d{6})(?!\\d)"
        score: 0.65

  - name: "RU INN Recognizer"
    type: custom
    supported_language: ru
    supported_entity: RU_INN
    context:
      - инн
      - налогоплательщик
      - налоговый
    patterns:
      - name: "Russian INN"
        regex: "(?<!\\d)(?:\\d{10}|\\d{12})(?!\\d)"
        score: 0.55

  - name: "RU SNILS Recognizer"
    type: custom
    supported_language: ru
    supported_entity: RU_SNILS
    context:
      - снилс
      - страховой
      - пенсионный
    patterns:
      - name: "Russian SNILS"
        regex: "(?<!\\d)\\d{3}[\\s\\-]?\\d{3}[\\s\\-]?\\d{3}[\\s\\-]?\\d{2}(?!\\d)"
        score: 0.65

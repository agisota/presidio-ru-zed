server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $analyzer_upstream http://analyzer:3000;
    set $anonymizer_upstream http://anonymizer:3000;
    set $processor_upstream http://processor:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"presidio-ru","language":"ru"}';
    }

    location = / {
        try_files /index.html =404;
    }

    location /analyzer/ {
        rewrite ^/analyzer/(.*)$ /$1 break;
        proxy_pass $analyzer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /anonymizer/ {
        rewrite ^/anonymizer/(.*)$ /$1 break;
        proxy_pass $anonymizer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /processor/ {
        rewrite ^/processor/(.*)$ /$1 break;
        proxy_pass $processor_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

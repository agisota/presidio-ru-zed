services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      analyzer:
        condition: service_healthy
      anonymizer:
        condition: service_healthy
      processor:
        condition: service_healthy
    ports:
      - "127.0.0.1:18088:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro

  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
      analyzer:
        condition: service_healthy
      anonymizer:
        condition: service_healthy
    env_file:
      - path: ./processor.env
        required: false
    environment:
      ANALYZER_URL: "http://analyzer:3000"
      ANONYMIZER_URL: "http://anonymizer:3000"
      MAX_UPLOAD_BYTES: "67108864"
      PROCESSOR_CHUNK_SIZE: "12000"
      PROCESSOR_PREVIEW_CHARS: "300000"
      PRESIDIO_TIMEOUT: "180"
      BIT_S3_ENDPOINT: "http://minio:9000"
      AWS_ENDPOINT_URL_S3: "http://minio:9000"
      S3_CONNECT_TIMEOUT: "3"
      S3_READ_TIMEOUT: "30"
      S3_MAX_ATTEMPTS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    env_file:
      - path: ./processor.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MINIO_ROOT_USER="$${AWS_ACCESS_KEY_ID:-data-zed-local}" \
        MINIO_ROOT_PASSWORD="$${AWS_SECRET_ACCESS_KEY:-data-zed-local-password}" \
        minio server /data --console-address ":9001"
    volumes:
      - data_zed_minio:/data

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    env_file:
      - path: ./processor.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 60); do
          mc alias set data-zed http://minio:9000 "$${AWS_ACCESS_KEY_ID:-data-zed-local}" "$${AWS_SECRET_ACCESS_KEY:-data-zed-local-password}" && break
          sleep 1
        done
        mc mb --ignore-existing "data-zed/$${BIT_S3_BUCKET:-agent-artifacts}"

  analyzer:
    build:
      context: ../../presidio-analyzer
      dockerfile: Dockerfile
      args:
        NLP_CONF_FILE: presidio_analyzer/conf/slim_ru.yaml
        ANALYZER_CONF_FILE: presidio_analyzer/conf/analyzer_ru.yaml
        RECOGNIZER_REGISTRY_CONF_FILE: presidio_analyzer/conf/recognizers_ru.yaml
    restart: unless-stopped
    environment:
      PORT: "3000"
      WORKERS: "2"
      LOG_LEVEL: "INFO"
    volumes:
      - ../../presidio-analyzer/presidio_analyzer/conf/analyzer_ru.yaml:/app/presidio_analyzer/conf/analyzer_ru.yaml:ro
      - ../../presidio-analyzer/presidio_analyzer/conf/slim_ru.yaml:/app/presidio_analyzer/conf/slim_ru.yaml:ro
      - ../../presidio-analyzer/presidio_analyzer/conf/recognizers_ru.yaml:/app/presidio_analyzer/conf/recognizers_ru.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  anonymizer:
    build:
      context: ../../presidio-anonymizer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      WORKERS: "2"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  data_zed_minio:
